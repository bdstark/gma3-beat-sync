# SPDX-License-Identifier: GPL-2.0-or-later
# Shared MIT-licensed review infrastructure; candidate review stays within this GPL repository.
name: PR automation
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, closed]
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created, edited]
  workflow_run:
    workflows: [CI]
    types: [completed]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR to review, or merged PR whose cleanup should be retried
        type: string
        required: false
permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  checks: read
jobs:
  review-and-accept:
    uses: bdstark/gma3-mcp/.github/workflows/pr-review-service.yml@d138c9753270d25574c4d13b98d4349df6269c3f
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
