# SPDX-License-Identifier: GPL-2.0-or-later
# Shared MIT-licensed review infrastructure; candidate review stays within this GPL repository.
name: PR automation
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited, closed]
  issue_comment:
    types: [created, edited]
  workflow_run:
    workflows: [CI, PR review event]
    types: [completed]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR to review, or merged PR whose cleanup should be retried
        type: string
        required: false
permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  checks: read
  statuses: read
jobs:
  review-and-accept:
    uses: bdstark/gma3-mcp/.github/workflows/pr-review-service.yml@a78b045bcdd7e85160fa9eac8ba917942d31c4ce
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
