name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

# Metadata-only edits must not cancel a running validation of the same PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.base && 'metadata' || 'code' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lua:
    if: github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null
    name: Lua 5.5 syntax, SPDX headers, harness and scripts
    runs-on: ubuntu-latest
    env:
      LUA_VERSION: 5.5.1
      # Published at https://www.lua.org/ftp/
      LUA_SHA256: 1c4b4068d67061f2a2231ad2b5422e77acea1487ea9890f6320af614f4373dce
    steps:
      - uses: actions/checkout@v4
      - name: Build stock Lua 5.5 (the console's version)
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSLO "https://www.lua.org/ftp/lua-${LUA_VERSION}.tar.gz"
          echo "${LUA_SHA256}  lua-${LUA_VERSION}.tar.gz" | sha256sum -c -
          tar xzf "lua-${LUA_VERSION}.tar.gz"
          make -C "lua-${LUA_VERSION}" linux
          echo "${{ runner.temp }}/lua-${LUA_VERSION}/src" >> "$GITHUB_PATH"
      - run: lua -v
      - run: scripts/check.sh spdx
      - run: scripts/check.sh lua
      - run: scripts/check.sh harness
      - run: scripts/check.sh scripts

  peer:
    if: github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null
    name: Test peer build, fixtures and vectors (Link submodule)
    runs-on: ubuntu-latest
    env:
      LUA_VERSION: 5.5.1
      LUA_SHA256: 1c4b4068d67061f2a2231ad2b5422e77acea1487ea9890f6320af614f4373dce
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build stock Lua 5.5 (the console's version)
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSLO "https://www.lua.org/ftp/lua-${LUA_VERSION}.tar.gz"
          echo "${LUA_SHA256}  lua-${LUA_VERSION}.tar.gz" | sha256sum -c -
          tar xzf "lua-${LUA_VERSION}.tar.gz"
          make -C "lua-${LUA_VERSION}" linux
          echo "${{ runner.temp }}/lua-${LUA_VERSION}/src" >> "$GITHUB_PATH"
      - run: scripts/check.sh peer
      - name: Fixtures agree with Link's parser
        run: scripts/check.sh fixtures
      - name: Vectors agree with Link's arithmetic
        run: scripts/check.sh vectors

  bridge:
    if: github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null
    name: Link bridge (Rust) on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version
      - name: fmt, clippy and tests (the Link session test is ignored)
        run: scripts/check.sh bridge
