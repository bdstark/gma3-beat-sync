# SPDX-License-Identifier: GPL-2.0-or-later
[package]
name = "link-bridge"
description = "Publishes gma3-phrase-sync's timeline to a Link session, and reports the session back (protocols LB1 and LB2), through Ableton's Link library"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
# The messages (MIT): docs/link-bridge.md in that repository is the contract.
link-bridge-protocol = { git = "https://github.com/bdstark/link-bridge-protocol.git", rev = "1ef87da471bbef2adf52ed287e30206aaa488004" }
ctrlc = "3"

[build-dependencies]
cmake = "0.1"

[lints.rust]
# Only src/link.rs, the bindings to the Link library, may use unsafe code.
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
